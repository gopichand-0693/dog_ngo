name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks & tests
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ci-not-a-real-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      SQLITE_PATH: ${{ github.workspace }}/ci.sqlite3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Django system check
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity=1

      - name: Verify JS bundle is present
        run: test -f static/app/bundle.js

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: scoobyhouse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
