[project]
name = "scoobyhouse"
version = "0.1.0"
description = "ScoobyHouse — Hyderabad dog shelter directory (Django + DRF SPA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<7",
    "djangorestframework>=3.15,<4",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "shelters*", "pages*", "donations*", "accounts*"]
